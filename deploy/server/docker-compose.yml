name: hariharibol

services:
  postgres:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hariharibol}
      POSTGRES_USER: ${POSTGRES_USER:-hariharibol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: ${POSTGRES_MEMORY_LIMIT:-512m}

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    env_file: [.env]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: ${REDIS_MEMORY_LIMIT:-256m}

  api:
    image: ${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${IMAGE_TAG:-latest}
    command: node server.js
    env_file: [.env]
    volumes:
      - ../secrets:/app/secrets:ro
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: ${API_MEMORY_LIMIT:-512m}
    restart: unless-stopped

  worker:
    image: ${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${IMAGE_TAG}
    command: node worker/index.js
    env_file: [.env]
    volumes:
      - ../secrets:/app/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-1.0}"
          memory: ${WORKER_MEMORY_LIMIT:-512m}
    restart: unless-stopped

  socket:
    image: ${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${IMAGE_TAG}
    command: node websocket/index.js
    env_file: [.env]
    volumes:
      - ../secrets:/app/secrets:ro
    ports: ["127.0.0.1:4001:4001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${SOCKET_CPU_LIMIT:-0.5}"
          memory: ${SOCKET_MEMORY_LIMIT:-256m}
    restart: unless-stopped

  deeplink:
    image: ${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${IMAGE_TAG}
    command: node deeplink/index.js
    env_file: [.env]
    volumes:
      - ../secrets:/app/secrets:ro
    ports: ["127.0.0.1:4002:4002"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "${DEEPLINK_CPU_LIMIT:-0.5}"
          memory: ${DEEPLINK_MEMORY_LIMIT:-256m}
    restart: unless-stopped

  admin:
    image: ${ECR_REGISTRY}/${ADMIN_REPOSITORY}:${IMAGE_TAG}
    ports: ["127.0.0.1:8080:80"]
    deploy:
      resources:
        limits:
          cpus: "${ADMIN_CPU_LIMIT:-0.5}"
          memory: ${ADMIN_MEMORY_LIMIT:-256m}
    restart: unless-stopped

  website:
    image: nginx:1.27-alpine
    volumes:
      - ../website:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
