map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream hariharibol_api {
  server 127.0.0.1:4000;
}

upstream hariharibol_socket {
  server 127.0.0.1:4001;
}

upstream hariharibol_deeplink {
  server 127.0.0.1:4002;
}

upstream hariharibol_admin {
  server 127.0.0.1:8080;
}

server {
  listen 80 default_server;
  server_name api.hariharibol.com admin.hariharibol.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name api.hariharibol.com;

  ssl_certificate /etc/letsencrypt/live/api.hariharibol.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hariharibol.com/privkey.pem;

  location /ws {
    proxy_pass http://hariharibol_socket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 60m;
  }

  location /api/ {
    proxy_pass http://hariharibol_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://hariharibol_api;
  }

  location = /.well-known/apple-app-site-association {
    proxy_pass http://hariharibol_deeplink;
  }

  location = /.well-known/assetlinks.json {
    proxy_pass http://hariharibol_deeplink;
  }

  location ~ ^/(verse|sloka|mantra|book)(/|$) {
    proxy_pass http://hariharibol_deeplink;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://hariharibol_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name admin.hariharibol.com;

  ssl_certificate /etc/letsencrypt/live/api.hariharibol.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hariharibol.com/privkey.pem;

  location / {
    proxy_pass http://hariharibol_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
