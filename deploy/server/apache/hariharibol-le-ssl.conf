# HariHariBol, port 443. Ported from the nginx site on the old server.
# Container ports (all on 127.0.0.1, see deploy/server/*.sh):
#   4000 api   4001 socket (websocket)   4002 deeplink   8080 admin   8081 website
#
# The certificates come from certbot, once DNS points here. The port 80 site has to be enabled first,
# because certbot answers its challenge through it:
#   sudo a2ensite hariharibol && sudo systemctl reload apache2
#   sudo certbot certonly --apache -d hariharibol.com -d www.hariharibol.com
#   sudo certbot certonly --apache -d api.hariharibol.com -d admin.hariharibol.com
# Then: sudo a2ensite hariharibol-le-ssl && sudo apache2ctl configtest
#       && sudo systemctl reload apache2
#
# Apache uses the first ProxyPass that matches, so the specific routes come
# before "/". The API's own /api/ and /health already fall through to "/".
# X-Forwarded-For is added by mod_proxy itself; the backend only trusts that
# (app.set('trust proxy', 1)), so no X-Real-IP is set.
<IfModule mod_ssl.c>

# hariharibol.com: landing page
<VirtualHost *:443>
    ServerName hariharibol.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/
    ErrorLog ${APACHE_LOG_DIR}/hariharibol-error.log
    CustomLog ${APACHE_LOG_DIR}/hariharibol-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/hariharibol.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hariharibol.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# www.hariharibol.com: sent to the bare domain (it is on the hariharibol.com certificate)
<VirtualHost *:443>
    ServerName www.hariharibol.com
    Redirect permanent / https://hariharibol.com/
    ErrorLog ${APACHE_LOG_DIR}/hariharibol-error.log
    CustomLog ${APACHE_LOG_DIR}/hariharibol-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/hariharibol.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hariharibol.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# api.hariharibol.com: API, websocket and deep links
<VirtualHost *:443>
    ServerName api.hariharibol.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # websocket, kept open up to 60 minutes like the nginx proxy_read_timeout
    ProxyPass /ws ws://127.0.0.1:4001/ws timeout=3600
    ProxyPassReverse /ws ws://127.0.0.1:4001/ws

    # app-link verification files and the shareable verse / sloka / mantra / book pages
    ProxyPassMatch "^/(\.well-known/(?:apple-app-site-association|assetlinks\.json))$" "http://127.0.0.1:4002/$1"
    ProxyPassMatch "^/((?:verse|sloka|mantra|book)(?:/.*)?)$" "http://127.0.0.1:4002/$1"

    # everything else, including /api/ and /health
    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    ErrorLog ${APACHE_LOG_DIR}/hariharibol-api-error.log
    CustomLog ${APACHE_LOG_DIR}/hariharibol-api-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/api.hariharibol.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.hariharibol.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

# admin.hariharibol.com: admin panel (uses the api.hariharibol.com certificate, as before)
<VirtualHost *:443>
    ServerName admin.hariharibol.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ErrorLog ${APACHE_LOG_DIR}/hariharibol-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/hariharibol-admin-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/api.hariharibol.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.hariharibol.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

</IfModule>
