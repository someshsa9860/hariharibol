# HariHariBol, port 80. Ported from the nginx site on the old server: every
# name is sent to https. Certificates come from certbot (see the -le-ssl file).
<VirtualHost *:80>
    ServerName hariharibol.com
    ServerAlias www.hariharibol.com api.hariharibol.com admin.hariharibol.com
    ErrorLog ${APACHE_LOG_DIR}/hariharibol-error.log
    CustomLog ${APACHE_LOG_DIR}/hariharibol-access.log combined
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
