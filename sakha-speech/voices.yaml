# Every voice Sakha Speech can speak with. Add a voice by adding an entry; no code changes.
#
#   language   app language code (en, hi, mr, ta, ...)
#   gender     male | female
#   engine     kokoro | parler   (sakha_speech/engines/)
#   licence    of the model / voice, checked before audio is made for the app
#   the rest   is handed to the engine as it is
#
# Only Indian voices are listed: the speakers of AI4Bharat's Indic Parler-TTS (ai4bharat/indic-parler-tts,
# gated: accept the terms on Hugging Face and run `hf auth login` once). The speaker is named at the start
# of `description`, which also sets the pace and tone. `seed` keeps the same voice across every sentence
# of a book. Every speaker the model card lists for English (21) and Hindi (4) is here, so the studio offers
# them all. The card recommends Thoma / Mary (English) and Rohit / Divya (Hindi); the rest are valid speakers
# it does not vouch for. The card gives no genders: they are taken from the names and still to be checked by
# ear in the studio (Chingkhei and Thoiba are Manipuri names, a guess). Kokoro's Hindi voices (hexgrad/Kokoro-82M,
# Apache-2.0) add more Hindi men: `voice` is the Kokoro voice name; its first letter (h, Hindi) picks the language.
#
# These are starting voices for the voice test, not the final choice: books.yaml picks the narrators.

voices:
  en-parler-thoma:
    language: en
    gender: male
    engine: parler
    licence: Apache-2.0
    model: ai4bharat/indic-parler-tts
    description: >-
      Thoma speaks slowly and calmly in a warm, clear voice with a gentle devotional tone.
      The recording is of very high quality, close up, with no background noise.
    seed: 108

