name: Website CI

# Deploys when main is merged into production (see deploy/README.md).
on:
  push:
    branches: [production]
    paths:
      - website/**
      - deploy/server/config.sh
      - deploy/server/common.sh
      - deploy/server/deploy.sh
      - deploy/server/website.sh
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    # "Run workflow" from any branch other than production does nothing.
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # NEXT_PUBLIC_* values are baked into the browser bundle at build time, so they are set here.
      - name: Build website
        working-directory: website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hariharibol.com
          NEXT_PUBLIC_API_BASE_URL: https://api.hariharibol.com
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.WEBSITE_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.WEBSITE_APPLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_REDIRECT_URI: https://hariharibol.com/
          NEXT_PUBLIC_FIREBASE_CONFIG: ${{ secrets.WEBSITE_FIREBASE_CONFIG }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.WEBSITE_RECAPTCHA_SITE_KEY }}

      # The standalone build is one self-contained folder; it travels as a single archive (it holds dot-folders)
      # and website.sh unpacks it beside the running container before restarting it.
      - name: Pack website
        run: tar czf website.tgz -C website/.next/standalone .

      - name: Upload website
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "website.tgz"
          target: ${{ secrets.DEPLOY_PATH }}/website

      - name: Upload server config
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/server/config.sh,deploy/server/common.sh,deploy/server/deploy.sh,deploy/server/website.sh"
          target: ${{ secrets.DEPLOY_PATH }}/server
          strip_components: 2

      # The host's web server (Apache, shared with other sites) and the domain's certificate are set up by
      # hand once, not here: this only starts the container and checks it answers on its own port.
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x server/*.sh
            IMAGE_TAG="${{ github.sha }}" ./server/deploy.sh website
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error http://127.0.0.1:8081/ |
                grep -Fq 'Make room for the sacred in your everyday.'; then
                exit 0
              fi
              sleep 2
            done
            echo "Website smoke check failed" >&2
            exit 1
