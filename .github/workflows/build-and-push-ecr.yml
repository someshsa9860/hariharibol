name: Admin CI

on:
  push:
    branches: [main, develop]
    paths:
      - admin/**
      - .github/workflows/build-and-push-ecr.yml
  pull_request:
    branches: [main, develop]
    paths:
      - admin/**
      - .github/workflows/build-and-push-ecr.yml
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        working-directory: admin
        run: npm ci
      - name: Build
        working-directory: admin
        env:
          VITE_API_URL: http://localhost:4000
          VITE_GOOGLE_CLIENT_ID: placeholder
        run: npm run build

  build-push-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: read
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: hariharibol-admin
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create deployment ECR password
        id: deployment-ecr
        run: echo "password=$(aws ecr get-login-password --region "$AWS_REGION")" >> "$GITHUB_OUTPUT"

      - name: Build and push admin image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            admin
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy on server
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.deployment-ecr.outputs.password }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_PASSWORD
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            IMAGE_TAG="${{ github.sha }}" ./server/deploy.sh admin
