name: Admin CI

on:
  push:
    branches: [main, develop]
    paths:
      - admin/**
      - .github/workflows/build-and-push-ecr.yml
  pull_request:
    branches: [main, develop]
    paths:
      - admin/**
      - .github/workflows/build-and-push-ecr.yml
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        working-directory: admin
        run: npm ci
      - name: Build
        working-directory: admin
        env:
          VITE_API_URL: http://localhost:4000
          VITE_GOOGLE_CLIENT_ID: placeholder
        run: npm run build

  build-push-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: hariharibol-admin
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The AWS keys decide which account receives the image, so stop if they
      # belong to any account other than the one in the ECR_REGISTRY variable.
      - name: Check the AWS account
        env:
          LOGGED_IN_TO: ${{ steps.login-ecr.outputs.registry }}
          EXPECTED: ${{ vars.ECR_REGISTRY }}
        run: |
          if [ "$LOGGED_IN_TO" != "$EXPECTED" ]; then
            echo "::error::AWS keys are for $LOGGED_IN_TO but the ECR_REGISTRY variable is '$EXPECTED'"
            exit 1
          fi

      # Both values are public (Vite writes them into the bundle), so they are
      # variables, not secrets. Empty ones build fine and give a panel that
      # cannot reach the API or sign anyone in, so refuse to build without them.
      - name: Build and push admin image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_API_URL" ] || [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Set the VITE_API_URL and VITE_GOOGLE_CLIENT_ID Actions variables"
            exit 1
          fi
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            admin
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy on server
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            EXPECT_ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}" IMAGE_TAG="${{ github.sha }}" ./server/deploy.sh admin
            ./server/prune.sh || true
